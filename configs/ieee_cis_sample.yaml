# ============================================================
# IEEE-CIS — Chạy thử sample 10% (KHÔNG phải paper)
# ============================================================
seed: 42
flags:
  gnn: true
  rl: true
  federated: true
  hard_edges: true
  soft_edges: false    # Tắt soft edges (paper không dùng)
  pruning: false       # Tắt pruning (paper không dùng)
experiment:
  name: ieee_cis_sample
  dataset: ieee
  pipeline: fraudgnn_rl
runtime:
  device: auto
output:
  dir: outputs
graph:
  time_window_hours: 1.0        # [PAPER]
  similarity_threshold: 0.9     # [PAPER]
  max_neighbors_per_node: 32    # [DEVIATION] Cap kỹ thuật
  device: null
  chunk_elems: 20000000.0
model:
  hidden_dim: 64                # [PAPER]
  num_layers: 3                 # [PAPER]
  dropout: 0.2
  shared_projection: true
  temporal_max_seq_len: 32      # [DEVIATION] Cap kỹ thuật
train:
  epochs: 50                    # Chạy thử 10 epoch
  patience: 3
  batch_size: 64                # [PAPER]
  learning_rate: 0.001          # [PAPER]
  weight_decay: 0.0
  pos_weight_max: 500.0        # [INFERRED] Tăng để học class thiểu số
  batch_mode: subgraph
  subgraph_nodes: 5000
  grad_steps_per_epoch: 1
  eval_chunk_nodes: 200000
rl:
  type: naf                     # [PAPER]
  hidden_dim: 128               # [PAPER]
  learning_rate: 0.001          # [PAPER]
  epochs: 200                    # Chạy thử 50 epoch RL
  env_batch_size: 1024
  update_batch_size: 64
  gamma: 0.99
  tau: 0.005
  buffer_size: 10000
  fpr_penalty: 1.0
  recall_weight: 0.25
  inference: grid               # [INFERRED] Tối ưu threshold
  n_threshold_bins: 19
federated:
  num_clients: 3                # [INFERRED] 3 clients
  rounds: 20                    # Chạy thử 20 rounds
  local_epochs: 1
  client_fraction: 1.0
  learning_rate: 0.001
  patience: 3
soft_graph:
  enabled: false                # Tắt (paper không dùng)
# XÓA HOÀN TOÀN MỤC PRUNING
dataset:
  name: IEEE-CIS
  path: data/raw/ieee_cis_fast.csv   # Sửa lại đường dẫn file _fast
  label_col: isFraud
  time_col: TransactionDT
  time_unit: second
  sample_frac: 0.5                   # Lấy 50% data
  random_state: 42
  entity_type_col: ProductCD
  entity_type_values:
  - W
  - C
  - H
  - R
  - S
split:
  strategy: temporal
  train_ratio: 0.64
  val_ratio: 0.16
preprocess:
  numeric_strategy: mean
  categorical_strategy: most_frequent
  drop_cols:
  - TransactionID
  categorical_cols: []
  onehot_min_frequency: null